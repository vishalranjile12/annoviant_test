server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 256;

    # Static assets — hashed filenames, can be cached long-term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files (favicons, hero images, team photos, etc.)
    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — every unknown path returns index.html so React Router resolves it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html itself; it must always re-fetch to pick up new asset hashes
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}
