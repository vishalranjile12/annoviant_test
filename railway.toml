# Railway service config for the frontend (annoviant-web).
#
# We use the Dockerfile builder (see railway.json). The Dockerfile copies
# the Vite build into nginx:alpine and EXPOSEs 8080; nginx's default CMD
# runs the server. Do NOT set a startCommand here — it would override the
# Docker CMD and silently re-launch the old `serve` binary.
[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
